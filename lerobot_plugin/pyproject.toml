[project]
name = "lerobot_robot_niryo"
version = "0.1.0"
description = "LeRobot Robot/Teleoperator adapters and collector for the Niryo Ned2 teleoperation stack"
readme = "README.md"
requires-python = "==3.12.*"
# Deliberately empty: rclpy and ROS message packages come from the ROS
# installation, while lerobot comes from the vlas environment. Adding them as
# PyPI dependencies would install incompatible duplicates.
dependencies = []

[project.optional-dependencies]
# pyniryo pulls OpenCV 5.x, which breaks LeRobot's OpenCV cameras. Install it
# together with a matching opencv-python pin, as done for the vlas venv:
#   uv pip install pyniryo "opencv-python==4.13.0.92"
calibration = ["pyniryo"]
# Rerun preview backend; without it the collector falls back to OpenCV.
viz = ["rerun-sdk"]

[project.scripts]
niryo-collect = "lerobot_robot_niryo.collect:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lerobot_robot_niryo"]
